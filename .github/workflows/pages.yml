name: Refresh theme rankings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Only a scheduled or manual run refreshes the data. An ordinary push
      # rebuilds the site from the committed dataset, which needs no browser.
      - name: Install Chromium
        if: ${{ github.event_name != 'push' }}
        run: npx playwright install --with-deps chromium
      - name: Scrape Chrome Web Store
        if: ${{ github.event_name != 'push' }}
        run: npm run scrape
      # A push made with GITHUB_TOKEN does not start another workflow run, so
      # committing here cannot retrigger this workflow.
      - name: Commit refreshed data
        if: ${{ github.event_name != 'push' }}
        run: |
          if [ -z "$(git status --porcelain data/themes.json)" ]; then
            echo "Theme data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/themes.json
          git commit -m "Refresh theme rankings"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Build site from the committed data
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
